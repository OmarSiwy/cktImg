name: ci

# What must stay green on every change. One runner: the library is pure Zig
# with no OS-specific code, and Zig cross-compiles the packages elsewhere.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The cheapest way to fail, so first.
      - name: Format
        run: zig fmt --check src tests tools build.zig build.zig.zon lint.zon

      # Library, algorithm (tests/cases.zig), API (tests/api.zig) and the C
      # program tests/abi_test.c against libcktimg.a — with the TikZ emitter
      # compiled out, as a consumer who only wants geometry gets it...
      - name: Tests (latex_renderer off)
        run: zig build test --summary all

      # ...and compiled in: the option must gate code, not hide it.
      - name: Tests (latex_renderer on)
        run: zig build test -Dlatex_renderer=true --summary all

      # Draws every textbook circuit through the public API.
      - name: Gallery
        run: zig build gallery -- --svgs gallery

      # The xschem target: every textbook drawing, netlisted back by xschem
      # itself, must have the input's nets.
      - name: xschem round trip
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xschem >/dev/null
          zig build
          python3 tools/xschem/roundtrip.py zig-out/bin/cktimg-xschem "$(command -v xschem)" gallery/*.cir

      # The library alone for a host without an OS (a wasm guest links it): `zig build`
      # must not reach the tools there, and `zig build lib` installs only the archive
      # and the header.
      - name: Library for wasm32-freestanding
        run: |
          set -euo pipefail
          zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall --prefix wasm-out
          zig build lib -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall --prefix wasm-lib
          test -s wasm-lib/lib/libcktimg.a && test -s wasm-lib/include/cktimg.h
          test ! -e wasm-out/bin && test ! -e wasm-lib/bin

      # The header is hand-written; -pedantic because a strict C compiler is
      # who it is for.
      - name: C header
        run: cc -std=c99 -Wall -Wextra -pedantic -fsyntax-only include/cktimg.h

      # A figure through pdflatex, the way a paper gets one: the package runs
      # cktimg-tex under shell escape and inputs what it wrote.
      - name: LaTeX figure
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-pictures texlive-latex-recommended >/dev/null
          zig build -Dlatex_renderer=true
          mkdir -p build/latex && cp examples/latex/* latex/cktimg.sty build/latex/
          cd build/latex
          PATH="$GITHUB_WORKSPACE/zig-out/bin:$PATH" pdflatex -shell-escape -interaction=nonstopmode -halt-on-error figure.tex
          test -s figure.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: |
            gallery/*.svg
            build/latex/figure.pdf
