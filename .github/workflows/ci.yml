name: ci

# What must stay green on every change. One runner: the library is pure Zig
# with no OS-specific code, and Zig cross-compiles the packages elsewhere.
on:
  push:
  pull_request:

permissions:
  contents: read

# The Zig engine lives in engine/ (the repository root is the Schemify plugin).
defaults:
  run:
    working-directory: engine

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The cheapest way to fail, so first.
      - name: Format
        run: zig fmt --check src tests tools build.zig build.zig.zon lint.zon

      # Library, algorithm (tests/cases.zig), API (tests/api.zig) and the C
      # program tests/abi_test.c against libcktimg.a — with the TikZ emitter
      # compiled out, as a consumer who only wants geometry gets it...
      - name: Tests (latex_renderer off)
        run: zig build test --summary all

      # ...and compiled in: the option must gate code, not hide it.
      - name: Tests (latex_renderer on)
        run: zig build test -Dlatex_renderer=true --summary all

      # Draws every textbook circuit through the public API.
      - name: Gallery
        run: zig build gallery -- --svgs gallery

      # The library alone for a host without an OS (a wasm guest links it): `zig build`
      # must not reach the tools there, and `zig build lib` installs only the archive
      # and the header.
      - name: Library for wasm32-freestanding
        run: |
          set -euo pipefail
          zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall --prefix wasm-out
          zig build lib -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall --prefix wasm-lib
          test -s wasm-lib/lib/libcktimg.a && test -s wasm-lib/include/cktimg.h
          test ! -e wasm-out/bin && test ! -e wasm-lib/bin
          # Without ZON settings the archive leaves Zig's ZON parser out.
          zig build lib -Dtarget=wasm32-freestanding -Doptimize=ReleaseSmall -Dzon_config=false --prefix wasm-nozon
          full=$(stat -c%s wasm-lib/lib/libcktimg.a); nozon=$(stat -c%s wasm-nozon/lib/libcktimg.a)
          echo "libcktimg.a: $full bytes, $nozon without zon_config"
          test "$nozon" -lt "$full"

      # The header is hand-written; -pedantic because a strict C compiler is
      # who it is for.
      - name: C header
        run: cc -std=c99 -Wall -Wextra -pedantic -fsyntax-only include/cktimg.h

      # A figure through pdflatex, the way a paper gets one: the package runs
      # cktimg-tex under shell escape and inputs what it wrote.
      - name: LaTeX figure
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-pictures texlive-latex-recommended >/dev/null
          zig build -Dlatex_renderer=true
          mkdir -p build/latex && cp examples/latex/* latex/cktimg.sty build/latex/
          cd build/latex
          PATH="$GITHUB_WORKSPACE/engine/zig-out/bin:$PATH" pdflatex -shell-escape -interaction=nonstopmode -halt-on-error figure.tex
          test -s figure.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: |
            engine/gallery/*.svg
            engine/build/latex/figure.pdf

  # The Schemify plugin (the repository root): Nix gives the flake-pinned rustc, wasm-ld and
  # Zig 0.17, the toolchain cktimg.wasm is reproducible under.
  plugin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      # build.sh fails when the module reaches 550 KB. It is byte-reproducible, so the
      # next step fails when the committed module differs from its rebuild (a source
      # change without its module, or a module built elsewhere): commit the artifact.
      - run: nix develop -c ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cktimg-wasm
          path: cktimg.wasm
          if-no-files-found: error
      - name: committed cktimg.wasm equals the rebuild
        run: |
          [ -z "$(git status --porcelain -- cktimg.wasm)" ] && exit 0
          echo "::error::cktimg.wasm differs from build.sh output: commit the cktimg-wasm artifact of this run"
          exit 1
      # Native oracles (round trip through Schemify's elab, netlister and spicecmp) and the
      # rebuilt guest through Schemify's real host.
      - run: nix develop -c cargo test --locked --no-fail-fast
      # The fixtures over the default fuel, at the manifest's fuel ceiling (10^11 per
      # event): needs an optimized wasmi, so its own profile.
      - name: over-budget fixtures at the fuel ceiling
        run: >-
          nix develop -c cargo test --locked --profile fuel --test guest
          -- --ignored over_budget --nocapture
