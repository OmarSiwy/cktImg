name: latex-package

# Builds the distributable LaTeX package: cktimg.sty plus a cktimg-tex binary for every
# platform a TeX user is likely to be on.
#
# ONE runner, five targets. Zig cross-compiles from any host to any target with no SDK,
# no container and no remote builder, so a matrix of ubuntu/macos/windows runners would
# be three times the queue time, three times the cache misses, and three chances for a
# runner image to drift -- to produce byte-identical results. If a target ever needs a
# real host (it will not: this program links no system library), add it as a separate
# job rather than dissolving this one into a matrix.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the release

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # ReleaseSafe, not ReleaseFast: this runs once per figure per LaTeX pass, so it is
      # never the bottleneck, and a released binary that traps on a bad index is far
      # kinder to a user with a strange netlist than one that emits nonsense.
      #
      # `-gnu` on linux and windows so the binaries do not depend on the host's libc
      # version or on MSVC redistributables.
      - name: Cross-compile cktimg-tex
        run: |
          set -euo pipefail
          for spec in \
            "x86_64-linux:x86_64-linux-gnu" \
            "aarch64-linux:aarch64-linux-gnu" \
            "x86_64-macos:x86_64-macos" \
            "aarch64-macos:aarch64-macos" \
            "x86_64-windows:x86_64-windows-gnu"
          do
            name="${spec%%:*}"
            triple="${spec##*:}"
            echo "::group::$name"
            zig build \
              -Dlatex_renderer=true \
              -Doptimize=ReleaseSafe \
              -Dtarget="$triple" \
              --prefix "build/$name"
            echo "::endgroup::"
          done

      # CTAN-style layout: everything a user needs under one directory named after the
      # package, so unzipping it into texmf/tex/latex/ or into a project both work.
      - name: Assemble the bundle
        run: |
          set -euo pipefail
          mkdir -p cktimg/bin cktimg/examples
          cp latex/cktimg.sty cktimg/
          cp LICENSE cktimg/
          cp README.md cktimg/
          cp examples/latex/figure.tex cktimg/examples/

          # Raw binaries get target-suffixed names as well, so a user can download one
          # file from the release page instead of the whole bundle.
          mkdir -p dist
          for d in build/*; do
            name="$(basename "$d")"
            mkdir -p "cktimg/bin/$name"
            case "$name" in
              *windows*) ext=".exe" ;;
              *)         ext="" ;;
            esac
            cp "$d/bin/cktimg-tex$ext" "cktimg/bin/$name/cktimg-tex$ext"
            cp "$d/bin/cktimg-tex$ext" "dist/cktimg-tex-$name$ext"
          done

          zip -r cktimg.zip cktimg
          ls -R cktimg dist

      - uses: actions/upload-artifact@v4
        with:
          name: cktimg-latex-package
          path: |
            cktimg.zip
            dist/*

      # workflow_dispatch runs have no tag to attach to, so they stop at the artifact
      # above -- which is the point of allowing them: rehearse the bundle without
      # publishing it.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cktimg.zip
            dist/*
          fail_on_unmatched_files: true
