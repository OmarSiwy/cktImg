name: latex-package

# The LaTeX package: cktimg.sty, a cktimg-tex binary for each platform a TeX
# user is likely to be on, the symbol set it draws with, and a worked
# example. On a version tag (or by hand, to rehearse without publishing).
#
# One runner, five targets: Zig cross-compiles with no SDK, and cktimg-tex
# links no system library.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # ReleaseSafe: this runs once per figure per LaTeX pass, never the
      # bottleneck, and a trap on a strange netlist beats a wrong figure.
      # `-gnu` so the binaries need neither a particular libc nor MSVC.
      - name: Cross-compile cktimg-tex
        run: |
          set -euo pipefail
          for spec in \
            "x86_64-linux:x86_64-linux-gnu" \
            "aarch64-linux:aarch64-linux-gnu" \
            "x86_64-macos:x86_64-macos" \
            "aarch64-macos:aarch64-macos" \
            "x86_64-windows:x86_64-windows-gnu"
          do
            name="${spec%%:*}"
            triple="${spec##*:}"
            echo "::group::$name"
            zig build -Dlatex_renderer=true -Doptimize=ReleaseSafe -Dtarget="$triple" --prefix "build/$name"
            echo "::endgroup::"
          done

      # CTAN-style: one directory named after the package, so unzipping into
      # texmf/tex/latex/ or into a project both work.
      - name: Assemble the bundle
        run: |
          set -euo pipefail
          mkdir -p cktimg/bin cktimg/examples dist
          cp latex/cktimg.sty README.md lint.zon cktimg/
          # The symbols cktimg-tex draws with by default, to copy and edit
          # (--symbols mine.zon).
          cp tests/symbols.zon cktimg/symbols.zon
          cp examples/latex/* cktimg/examples/
          for d in build/*; do
            name="$(basename "$d")"
            case "$name" in *windows*) ext=".exe" ;; *) ext="" ;; esac
            mkdir -p "cktimg/bin/$name"
            cp "$d/bin/cktimg-tex$ext" "cktimg/bin/$name/"
            cp "$d/bin/cktimg-tex$ext" "dist/cktimg-tex-$name$ext"
          done
          zip -r dist/cktimg-latex.zip cktimg
          ls -R cktimg dist

      # The bundle must draw: the example through pdflatex with the linux
      # binary from the bundle itself.
      - name: Compile the example
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-pictures texlive-latex-recommended >/dev/null
          cd cktimg/examples
          cp ../cktimg.sty .
          PATH="$PWD/../bin/x86_64-linux:$PATH" pdflatex -shell-escape -interaction=nonstopmode -halt-on-error figure.tex
          test -s figure.pdf
          cp figure.pdf ../../dist/cktimg-example.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: latex-package
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
